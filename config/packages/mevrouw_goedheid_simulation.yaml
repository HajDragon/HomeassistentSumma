# ============================================================
# Mevrouw Goedheid - Body Scan Simulatie (6-maanden trend)
# Lesplan: Zorg en technologie - Body scan slimme weegschaal
# ============================================================

# ── Helpers ────────────────────────────────────────────────

input_select:
  simulatiefase_goedheid:
    name: "Simulatiefase Mevrouw Goedheid"
    options:
      - "Reset / Startklaar"
      - "Meting 1 (start)"
      - "Meting 2 (2 mnd)"
      - "Meting 3 (4 mnd)"
      - "Meting 4 (6 mnd)"
    initial: "Reset / Startklaar"
    icon: mdi:timeline-clock

  data_bron_weegschaal:
    name: "Databron"
    options:
      - "Simulatie"
      - "Live Data (Echte Weegschaal)"
    initial: "Simulatie"
    icon: mdi:database-switch

input_datetime:
  goedheid_meetdatum:
    name: "Datum van Huidige Meting"
    has_date: true
    has_time: false
    icon: mdi:calendar-clock

input_number:
  goedheid_spiermassa:
    name: "Spiermassa"
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "kg"
    icon: mdi:arm-flex

  goedheid_vetmassa:
    name: "Vetmassa"
    min: 0
    max: 120
    step: 0.1
    unit_of_measurement: "kg"
    icon: mdi:food-drumstick

  goedheid_gewicht:
    name: "Totaal Gewicht"
    min: 0
    max: 200
    step: 0.1
    unit_of_measurement: "kg"
    icon: mdi:scale-bathroom

  goedheid_bmi:
    name: "BMI"
    min: 0
    max: 60
    step: 0.1
    unit_of_measurement: "kg/m2"
    icon: mdi:human

  goedheid_vochtbalans:
    name: "Vochtbalans"
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    icon: mdi:water-percent

  goedheid_lengte:
    name: "Lichaamslengte (m)"
    min: 1.0
    max: 2.5
    step: 0.01
    unit_of_measurement: "m"
    icon: mdi:human-male-height
    initial: 1.65

input_text:
  goedheid_student_id:
    name: "Student ID"
    min: 1
    max: 50
    icon: mdi:account-badge

  goedheid_pesdie_output:
    name: "PESDIE Output"
    min: 1
    max: 255
    icon: mdi:text-box-edit-outline

input_boolean:
  goedheid_weegschaal_gereserveerd:
    name: "Weegschaal gereserveerd (Xerte)"
    icon: mdi:calendar-check

  goedheid_kennis_vochtbalans_bmi:
    name: "Studenten kennen vochtbalans & BMI"
    icon: mdi:water-percent

  goedheid_kennis_spijsvertering:
    name: "Studenten kennen spijsvertering"
    icon: mdi:stomach

  goedheid_kennis_pesdie:
    name: "Studenten kunnen PESDIE toepassen"
    icon: mdi:clipboard-text-outline

template:
  - sensor:
      - name: "display_gewicht"
        unique_id: display_gewicht
        unit_of_measurement: "kg"
        device_class: weight
        state_class: measurement
        state: >
          {%- if is_state("input_select.data_bron_weegschaal", "Simulatie") %}
            {{ states("input_number.goedheid_gewicht") }}
          {%- else %}
            {{ states("sensor.withings_gewicht") }}
          {%- endif %}
        icon: mdi:scale-bathroom

      - name: "display_bmi"
        unique_id: display_bmi
        unit_of_measurement: "kg/m²"
        state_class: measurement
        state: >
          {%- if is_state("input_select.data_bron_weegschaal", "Simulatie") %}
            {{ states("input_number.goedheid_bmi") }}
          {%- else %}
            {%- set w = states("sensor.withings_gewicht") | float(0) %}
            {%- set h = states("input_number.goedheid_lengte") | float(1.65) %}
            {{ (w / (h * h)) | round(1) if h > 0 else "unknown" }}
          {%- endif %}
        icon: mdi:human

      - name: "display_spiermassa"
        unique_id: display_spiermassa
        unit_of_measurement: "kg"
        device_class: weight
        state_class: measurement
        state: >
          {%- if is_state("input_select.data_bron_weegschaal", "Simulatie") %}
            {{ states("input_number.goedheid_spiermassa") }}
          {%- else %}
            {{ states("sensor.withings_spiermassa") }}
          {%- endif %}
        icon: mdi:arm-flex

      - name: "display_vetmassa"
        unique_id: display_vetmassa
        unit_of_measurement: "kg"
        device_class: weight
        state_class: measurement
        state: >
          {%- if is_state("input_select.data_bron_weegschaal", "Simulatie") %}
            {{ states("input_number.goedheid_vetmassa") }}
          {%- else %}
            {{ states("sensor.withings_vetmassa") }}
          {%- endif %}
        icon: mdi:food-drumstick

      - name: "display_vochtbalans"
        unique_id: display_vochtbalans
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {%- if is_state("input_select.data_bron_weegschaal", "Simulatie") %}
            {{ states("input_number.goedheid_vochtbalans") }}
          {%- else %}
            {%- set live = states("sensor.withings_vochtbalans") %}
            {{ live if live not in ["unknown", "unavailable", "none", ""] else states("input_number.goedheid_vochtbalans") }}
          {%- endif %}
        icon: mdi:water-percent

      - name: "goedheid_les_klaar"
        unique_id: goedheid_les_klaar
        state: >
          {{ is_state('input_boolean.goedheid_weegschaal_gereserveerd', 'on')
             and is_state('input_boolean.goedheid_kennis_vochtbalans_bmi', 'on')
             and is_state('input_boolean.goedheid_kennis_spijsvertering', 'on')
             and is_state('input_boolean.goedheid_kennis_pesdie', 'on') }}
        icon: >
          {% if is_state('sensor.goedheid_les_klaar', 'True') %}
            mdi:check-circle
          {% else %}
            mdi:alert-circle
          {% endif %}

script:
  reset_goedheid_simulatie:
    alias: "Reset Simulatie Mevrouw Goedheid"
    icon: mdi:restart
    sequence:
      - service: simulation_manager.reset_simulation
      - service: input_select.select_option
        target:
          entity_id: input_select.simulatiefase_goedheid
        data:
          option: "Reset / Startklaar"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_spiermassa
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_vetmassa
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_gewicht
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_bmi
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_vochtbalans
        data:
          value: 0
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.goedheid_meetdatum
        data:
          date: "{{ now().strftime('%Y-%m-%d') }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.goedheid_student_id
        data:
          value: ""
      - service: input_text.set_value
        target:
          entity_id: input_text.goedheid_pesdie_output
        data:
          value: ""

  sync_display_naar_simulatie_invoer:
    alias: "Sync Meetwaarden naar Simulatie Invoer"
    icon: mdi:sync-circle
    sequence:
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_gewicht
        data:
          value: "{{ states('sensor.display_gewicht') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_spiermassa
        data:
          value: "{{ states('sensor.display_spiermassa') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_vetmassa
        data:
          value: "{{ states('sensor.display_vetmassa') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_bmi
        data:
          value: "{{ states('sensor.display_bmi') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_vochtbalans
        data:
          value: "{{ states('sensor.display_vochtbalans') | float(0) }}"

  goedheid_sla_meting_op:
    alias: "Sla Huidige Meting Op"
    icon: mdi:content-save-check
    sequence:
      - service: simulation_manager.save_measurement
        data:
          gewicht:    "{{ states('input_number.goedheid_gewicht')    | float(0) }}"
          spiermassa: "{{ states('input_number.goedheid_spiermassa') | float(0) }}"
          vetmassa:   "{{ states('input_number.goedheid_vetmassa')   | float(0) }}"
          vochtbalans: "{{ states('input_number.goedheid_vochtbalans') | float(0) }}"
          bmi:        "{{ states('input_number.goedheid_bmi')        | float(0) }}"
          timestamp:  "{{ states('input_datetime.goedheid_meetdatum') }}"
          pesdie_student_id: "{{ states('input_text.goedheid_student_id') | trim }}"
          pesdie_output: "{{ states('input_text.goedheid_pesdie_output') | trim }}"
          pesdie_phase: "{{ states('input_select.simulatiefase_goedheid') }}"
          pesdie_saved_at: "{{ now().isoformat() }}"

  goedheid_submit_pesdie:
    alias: "Submit PESDIE"
    icon: mdi:clipboard-check-outline
    sequence:
      - variables:
          pesdie_output_value: >
            {% set raw = states('input_text.goedheid_pesdie_output') | trim %}
            {{ '' if raw in ['unknown', 'unavailable', 'none'] else raw }}
      - service: simulation_manager.switch_period
        data:
          period_id: "{{ states('sensor.simulation_manager') }}"
          date: "{{ states('input_datetime.goedheid_meetdatum') }}"
      - service: simulation_manager.save_measurement
        data:
          timestamp: "{{ states('input_datetime.goedheid_meetdatum') }}"
          pesdie_submission_number: "{{ pesdie_output_value }}"
          pesdie_student_id: "{{ states('input_text.goedheid_student_id') | trim }}"
          pesdie_output: "{{ pesdie_output_value }}"
          pesdie_phase: "{{ states('input_select.simulatiefase_goedheid') }}"
          pesdie_saved_at: "{{ now().isoformat() }}"

automation:
  - id: goedheid_simulatie_fase_wissel
    alias: "Goedheid - Update metingen bij fasewissel"
    trigger:
      - platform: state
        entity_id: input_select.simulatiefase_goedheid
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.simulatiefase_goedheid
                state: "Reset / Startklaar"
            sequence:
              - service: script.reset_goedheid_simulatie
          - conditions:
              - condition: state
                entity_id: input_select.simulatiefase_goedheid
                state: "Meting 1 (start)"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.goedheid_meetdatum
                data:
                  date: "2026-01-01"
              - service: simulation_manager.switch_period
                data:
                  period_id: "period_1"
                  label: "Meting 1 (start)"
                  date: "2026-01-01"
          - conditions:
              - condition: state
                entity_id: input_select.simulatiefase_goedheid
                state: "Meting 2 (2 mnd)"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.goedheid_meetdatum
                data:
                  date: "2026-03-01"
              - service: simulation_manager.switch_period
                data:
                  period_id: "period_2"
                  label: "Meting 2 (2 mnd)"
                  date: "2026-03-01"
          - conditions:
              - condition: state
                entity_id: input_select.simulatiefase_goedheid
                state: "Meting 3 (4 mnd)"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.goedheid_meetdatum
                data:
                  date: "2026-05-01"
              - service: simulation_manager.switch_period
                data:
                  period_id: "period_3"
                  label: "Meting 3 (4 mnd)"
                  date: "2026-05-01"
          - conditions:
              - condition: state
                entity_id: input_select.simulatiefase_goedheid
                state: "Meting 4 (6 mnd)"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.goedheid_meetdatum
                data:
                  date: "2026-07-01"
              - service: simulation_manager.switch_period
                data:
                  period_id: "period_4"
                  label: "Meting 4 (6 mnd)"
                  date: "2026-07-01"
        default:
          - service: system_log.write
            data:
              message: "Goedheid simulatie: onbekende fase geselecteerd"
              level: warning

  - id: goedheid_period_naar_fase_sync
    alias: "Goedheid - simulation_manager periode naar simulatiefase bridge"
    trigger:
      - platform: state
        entity_id: sensor.simulation_manager
    condition:
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.simulation_manager
            state: "none"
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: sensor.simulation_manager
                state: "period_1"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.simulatiefase_goedheid
                data:
                  option: "Meting 1 (start)"
          - conditions:
              - condition: state
                entity_id: sensor.simulation_manager
                state: "period_2"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.simulatiefase_goedheid
                data:
                  option: "Meting 2 (2 mnd)"
          - conditions:
              - condition: state
                entity_id: sensor.simulation_manager
                state: "period_3"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.simulatiefase_goedheid
                data:
                  option: "Meting 3 (4 mnd)"
          - conditions:
              - condition: state
                entity_id: sensor.simulation_manager
                state: "period_4"
            sequence:
              - service: input_select.select_option
                target:
                  entity_id: input_select.simulatiefase_goedheid
                data:
                  option: "Meting 4 (6 mnd)"


