                target: { entity_id: input_number.goedheid_bloeddruk_sys }
                data: { value: 155 }
              - service: input_number.set_value
                target: { entity_id: input_number.goedheid_bloeddruk_dia }
                data: { value: 95 }
              - service: input_number.set_value
                target: { entity_id: input_number.goedheid_hartfrequentie }
                data: { value: 102 }
              - service: input_number.set_value
                target: { entity_id: input_number.goedheid_ademfrequentie }
                data: { value: 22 }
              - service: input_number.set_value
                target: { entity_id: input_number.goedheid_saturatie }
                data: { value: 92 }
              - service: input_text.set_value
                target: { entity_id: input_text.goedheid_opmerking }
                data: { value: "Duidelijke verslechtering" }
              - service: simulation_manager.switch_period
                data: { period_id: "period_8", label: "Meting 8 (25-03-2026)", date: "2026-03-25" }
        default:
          - service: system_log.write
            data:
              message: "Goedheid simulatie: onbekende fase geselecteerd"
              level: warning

  - id: goedheid_period_naar_fase_sync
    alias: "Goedheid - simulation_manager periode naar simulatiefase bridge"
    trigger:
      - platform: state
        entity_id: sensor.simulation_manager
    condition:
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.simulation_manager
            state: "none"
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: sensor.simulation_manager
                state: "period_1"
            sequence:
              - service: input_select.select_option
                target: { entity_id: input_select.simulatiefase_goedheid }
                data: { option: "Meting 1 (01-03-2026)" }
          - conditions:
              - condition: state
                entity_id: sensor.simulation_manager
                state: "period_2"
            sequence:
              - service: input_select.select_option
                target: { entity_id: input_select.simulatiefase_goedheid }
                data: { option: "Meting 2 (04-03-2026)" }
          - conditions:
              - condition: state
                entity_id: sensor.simulation_manager
                state: "period_3"
