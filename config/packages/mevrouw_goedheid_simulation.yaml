  - id: goedheid_scan_photos_on_start
    alias: "Goedheid - Scan Photos Directory on Startup"
    trigger:
      - platform: homeassistant
        event: start
    action:
      - service: script.scan_photos_directory
    mode: single

  - id: goedheid_sync_livedata_naar_invoer
    alias: "Goedheid - Sync Live Data naar Simulatie Invoer"
    trigger:
      - platform: state
        entity_id: input_select.data_bron_weegschaal
      - platform: state
        entity_id:
          - sensor.display_gewicht
          - sensor.display_bloeddruk_systolisch
          - sensor.display_bloeddruk_diastolisch
          - sensor.display_hartfrequentie
          - sensor.display_ademfrequentie
          - sensor.display_saturatie
      - platform: homeassistant
        event: start
    condition:
      - condition: template
        value_template: >
          {{ states('input_select.data_bron_weegschaal') | lower | replace(' ', '') != 'simulatie' }}
    action:
      - service: script.sync_display_naar_simulatie_invoer
    mode: queued


  - id: goedheid_alert_hoge_pols
    alias: "Goedheid Alert - Hoge Pols"
    trigger:
      - platform: numeric_state
        entity_id: sensor.hartfrequentie
        above: 100
    action:
      - service: persistent_notification.create
        data:
          title: "Vital Alert: Hoge pols"
          message: "Hartfrequentie is {{ states('sensor.hartfrequentie') }} bpm. Drempel is > 100 bpm."
      - service: system_log.write
        data:
          level: warning
          message: "Goedheid alert: hartfrequentie boven 100 bpm"
