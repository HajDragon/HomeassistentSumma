  - id: goedheid_alert_lage_saturatie
    alias: "Goedheid Alert - Lage Saturatie"
    trigger:
      - platform: numeric_state
        entity_id: sensor.saturatie
        below: 93
    action:
      - service: persistent_notification.create
        data:
          title: "Vital Alert: Lage saturatie"
          message: "Saturatie is {{ states('sensor.saturatie') }}%. Drempel is < 93%."
      - service: system_log.write
        data:
          level: warning
          message: "Goedheid alert: saturatie onder 93%"

  - id: goedheid_alert_hoge_pols
    alias: "Goedheid Alert - Hoge Pols"
    trigger:
      - platform: numeric_state
        entity_id: sensor.hartfrequentie
        above: 100
    action:
      - service: persistent_notification.create
        data:
          title: "Vital Alert: Hoge pols"
          message: "Hartfrequentie is {{ states('sensor.hartfrequentie') }} bpm. Drempel is > 100 bpm."
      - service: system_log.write
        data:
          level: warning
          message: "Goedheid alert: hartfrequentie boven 100 bpm"
