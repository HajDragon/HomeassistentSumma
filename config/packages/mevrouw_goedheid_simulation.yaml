# ============================================================
# Mevrouw Goedheid - Body Scan + BPM Connect Cardiac Simulation
# Scenario refresh: March 2026, 8 datapoints (01-03 .. 25-03)
# ============================================================

input_select:
  simulatiefase_goedheid:
    name: "Simulatiefase Mevrouw Goedheid"
    options:
      - "Reset / Startklaar"
      - "Meting 1 (01-03-2026)"
      - "Meting 2 (04-03-2026)"
      - "Meting 3 (08-03-2026)"
      - "Meting 4 (11-03-2026)"
      - "Meting 5 (15-03-2026)"
      - "Meting 6 (18-03-2026)"
      - "Meting 7 (22-03-2026)"
      - "Meting 8 (25-03-2026)"
    initial: "Reset / Startklaar"
    icon: mdi:timeline-clock

  data_bron_weegschaal:
    name: "Databron"
    options:
      - "Simulatie"
      - "Live Data (Body Scan / BPM Connect)"
    initial: "Simulatie"
    icon: mdi:database-switch

input_datetime:
  goedheid_meetdatum:
    name: "Datum van Huidige Meting"
    has_date: true
    has_time: false
    icon: mdi:calendar-clock

input_number:
  goedheid_gewicht:
    name: "Gewicht"
    min: 0
    max: 200
    step: 0.1
    unit_of_measurement: "kg"
    icon: mdi:scale-bathroom

  goedheid_bloeddruk_sys:
    name: "Bloeddruk Systolisch"
    min: 60
    max: 260
    step: 1
    unit_of_measurement: "mmHg"
    icon: mdi:blood-bag

  goedheid_bloeddruk_dia:
    name: "Bloeddruk Diastolisch"
    min: 40
    max: 180
    step: 1
    unit_of_measurement: "mmHg"
    icon: mdi:blood-bag

  goedheid_hartfrequentie:
    name: "Hartfrequentie"
    min: 30
    max: 220
    step: 1
    unit_of_measurement: "bpm"
    icon: mdi:heart-pulse

  goedheid_ademfrequentie:
    name: "Ademfrequentie"
    min: 6
    max: 50
    step: 1
    unit_of_measurement: "/min"
    icon: mdi:lungs

  goedheid_saturatie:
    name: "Saturatie"
    min: 50
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:oxygen-cylinder

input_text:
  goedheid_opmerking:
    name: "Opmerking"
    min: 0
    max: 255
    icon: mdi:text-box-outline

template:
  - sensor:
      - name: "display_gewicht"
        unique_id: display_gewicht
        unit_of_measurement: "kg"
        device_class: weight
        state_class: measurement
        state: >
          {%- if is_state("input_select.data_bron_weegschaal", "Simulatie") %}
            {{ states("input_number.goedheid_gewicht") }}
          {%- else %}
            {{ states("sensor.withings_gewicht") }}
          {%- endif %}
        icon: mdi:scale-bathroom

      - name: "display_bloeddruk_systolisch"
        unique_id: display_bloeddruk_systolisch
        unit_of_measurement: "mmHg"
        state_class: measurement
        state: >
          {%- if is_state("input_select.data_bron_weegschaal", "Simulatie") %}
            {{ states("input_number.goedheid_bloeddruk_sys") }}
          {%- else %}
            {{ states("sensor.withings_systolische_bloeddruk") }}
          {%- endif %}
        icon: mdi:blood-bag

      - name: "display_bloeddruk_diastolisch"
        unique_id: display_bloeddruk_diastolisch
        unit_of_measurement: "mmHg"
        state_class: measurement
        state: >
          {%- if is_state("input_select.data_bron_weegschaal", "Simulatie") %}
            {{ states("input_number.goedheid_bloeddruk_dia") }}
          {%- else %}
            {{ states("sensor.withings_diastolische_bloeddruk") }}
          {%- endif %}
        icon: mdi:blood-bag

      - name: "display_bloeddruk"
        unique_id: display_bloeddruk
        state: >
          {{ states('sensor.display_bloeddruk_systolisch') }}/{{ states('sensor.display_bloeddruk_diastolisch') }}
        icon: mdi:blood-bag

      - name: "display_hartfrequentie"
        unique_id: display_hartfrequentie
        unit_of_measurement: "bpm"
        state_class: measurement
        state: >
          {%- if is_state("input_select.data_bron_weegschaal", "Simulatie") %}
            {{ states("input_number.goedheid_hartfrequentie") }}
          {%- else %}
            {{ states("sensor.withings_hartslag") }}
          {%- endif %}
        icon: mdi:heart-pulse

      - name: "display_ademfrequentie"
        unique_id: display_ademfrequentie
        unit_of_measurement: "/min"
        state_class: measurement
        state: "{{ states('input_number.goedheid_ademfrequentie') }}"
        icon: mdi:lungs

      - name: "display_saturatie"
        unique_id: display_saturatie
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {%- if is_state("input_select.data_bron_weegschaal", "Simulatie") %}
            {{ states("input_number.goedheid_saturatie") }}
          {%- else %}
            {{ states("sensor.withings_spo2") }}
          {%- endif %}
        icon: mdi:oxygen-cylinder

      - name: "gewicht"
        unique_id: goedheid_sensor_gewicht
        unit_of_measurement: "kg"
        state_class: measurement
        state: "{{ states('sensor.display_gewicht') }}"

      - name: "bloeddruk"
        unique_id: goedheid_sensor_bloeddruk
        state: "{{ states('sensor.display_bloeddruk') }}"

      - name: "hartfrequentie"
        unique_id: goedheid_sensor_hartfrequentie
        unit_of_measurement: "bpm"
        state_class: measurement
        state: "{{ states('sensor.display_hartfrequentie') }}"

      - name: "ademfrequentie"
        unique_id: goedheid_sensor_ademfrequentie
        unit_of_measurement: "/min"
        state_class: measurement
        state: "{{ states('sensor.display_ademfrequentie') }}"

      - name: "saturatie"
        unique_id: goedheid_sensor_saturatie
        unit_of_measurement: "%"
        state_class: measurement
        state: "{{ states('sensor.display_saturatie') }}"

  - binary_sensor:
      - name: "goedheid_alert_lage_saturatie"
        unique_id: goedheid_alert_lage_saturatie
        state: "{{ states('sensor.saturatie') | float(0) < 93 }}"
        icon: mdi:alert

      - name: "goedheid_alert_hoge_pols"
        unique_id: goedheid_alert_hoge_pols
        state: "{{ states('sensor.hartfrequentie') | float(0) > 100 }}"
        icon: mdi:alert

script:
  reset_goedheid_simulatie:
    alias: "Reset Simulatie Mevrouw Goedheid"
    icon: mdi:restart
    sequence:
      - service: simulation_manager.reset_simulation
      - service: input_select.select_option
        target:
          entity_id: input_select.simulatiefase_goedheid
        data:
          option: "Reset / Startklaar"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.goedheid_meetdatum
        data:
          date: "2026-03-01"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_gewicht
        data:
          value: 68
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_bloeddruk_sys
        data:
          value: 130
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_bloeddruk_dia
        data:
          value: 80
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_hartfrequentie
        data:
          value: 72
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_ademfrequentie
        data:
          value: 16
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_saturatie
        data:
          value: 96
      - service: input_text.set_value
        target:
          entity_id: input_text.goedheid_opmerking
        data:
          value: "Stabiele situatie na ontslag"

  sync_display_naar_simulatie_invoer:
    alias: "Sync Meetwaarden naar Simulatie Invoer"
    icon: mdi:sync-circle
    sequence:
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_gewicht
        data:
          value: "{{ states('sensor.display_gewicht') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_bloeddruk_sys
        data:
          value: "{{ states('sensor.display_bloeddruk_systolisch') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_bloeddruk_dia
        data:
          value: "{{ states('sensor.display_bloeddruk_diastolisch') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_hartfrequentie
        data:
          value: "{{ states('sensor.display_hartfrequentie') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_saturatie
        data:
          value: "{{ states('sensor.display_saturatie') | float(0) }}"

  goedheid_sla_meting_op:
    alias: "Sla Huidige Cardio Meting Op"
    icon: mdi:content-save-check
    sequence:
      - service: simulation_manager.save_measurement
        data:
          gewicht: "{{ states('input_number.goedheid_gewicht') | float(0) }}"
          bloeddruk_sys: "{{ states('input_number.goedheid_bloeddruk_sys') | float(0) }}"
          bloeddruk_dia: "{{ states('input_number.goedheid_bloeddruk_dia') | float(0) }}"
          hartfrequentie: "{{ states('input_number.goedheid_hartfrequentie') | float(0) }}"
          ademfrequentie: "{{ states('input_number.goedheid_ademfrequentie') | float(0) }}"
          saturatie: "{{ states('input_number.goedheid_saturatie') | float(0) }}"
          bloeddruk: "{{ states('input_number.goedheid_bloeddruk_sys') | int(0) }}/{{ states('input_number.goedheid_bloeddruk_dia') | int(0) }}"
          opmerking: "{{ states('input_text.goedheid_opmerking') | trim }}"
          profile_age: 70
          profile_history: "History of MI, Arthrosis"
          timestamp: "{{ states('input_datetime.goedheid_meetdatum') }}"

automation:
  - id: goedheid_simulatie_fase_wissel
    alias: "Goedheid - Update cardio metingen bij fasewissel"
    trigger:
      - platform: state
        entity_id: input_select.simulatiefase_goedheid
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.simulatiefase_goedheid
                state: "Reset / Startklaar"
            sequence:
              - service: script.reset_goedheid_simulatie

          - conditions:
              - condition: state
                entity_id: input_select.simulatiefase_goedheid
                state: "Meting 1 (01-03-2026)"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.goedheid_meetdatum
                data: { date: "2026-03-01" }
              - service: input_number.set_value
                target: { entity_id: input_number.goedheid_gewicht }
                data: { value: 68.0 }
              - service: input_number.set_value
                target: { entity_id: input_number.goedheid_bloeddruk_sys }
                data: { value: 130 }
              - service: input_number.set_value
                target: { entity_id: input_number.goedheid_bloeddruk_dia }
                data: { value: 80 }
              - service: input_number.set_value
                target: { entity_id: input_number.goedheid_hartfrequentie }
                data: { value: 72 }
              - service: input_number.set_value
                target: { entity_id: input_number.goedheid_ademfrequentie }
                data: { value: 16 }
              - service: input_number.set_value
                target: { entity_id: input_number.goedheid_saturatie }
                data: { value: 96 }
              - service: input_text.set_value
                target: { entity_id: input_text.goedheid_opmerking }
                data: { value: "Stabiele situatie na ontslag" }
              - service: simulation_manager.switch_period
