# ============================================================
# Mevrouw Goedheid - Body Scan + BPM Connect Cardiac Simulation
# Scenario refresh: March 2026, 8 datapoints (01-03 .. 25-03)
# ============================================================

input_select:
  simulatiefase_goedheid:
    name: "Simulatiefase Mevrouw Goedheid"
    options:
      - "Reset / Startklaar"
      - "Meting 1 (01-03)"
      - "Meting 2 (04-03)"
      - "Meting 3 (08-03)"
      - "Meting 4 (11-03)"
      - "Meting 5 (15-03)"
      - "Meting 6 (18-03)"
      - "Meting 7 (22-03)"
      - "Meting 8 (25-03)"
    initial: "Reset / Startklaar"
    icon: mdi:timeline-clock

  data_bron_weegschaal:
    name: "Databron"
    options:
      - "Simulatie"
      - "Live Data (Body Scan / BPM Connect)"
    initial: "Simulatie"
    icon: mdi:database-switch

  available_photos:
    name: "Beschikbare patiëntfoto's"
    options:
      - "(geen foto's gevonden)"
    initial: "(geen foto's gevonden)"
    icon: mdi:image-multiple

photo_scanner:

input_datetime:
  goedheid_meetdatum:
    name: "Datum van Huidige Meting"
    has_date: true
    has_time: false
    icon: mdi:calendar-clock

input_number:
  goedheid_gewicht:
    name: "Gewicht"
    min: 0
    max: 200
    step: 0.1
    unit_of_measurement: "kg"
    icon: mdi:scale-bathroom

  goedheid_bloeddruk_sys:
    name: "Bloeddruk Systolisch"
    min: 60
    max: 260
    step: 1
    unit_of_measurement: "mmHg"
    icon: mdi:blood-bag

  goedheid_bloeddruk_dia:
    name: "Bloeddruk Diastolisch"
    min: 40
    max: 180
    step: 1
    unit_of_measurement: "mmHg"
    icon: mdi:blood-bag

  goedheid_hartfrequentie:
    name: "Hartfrequentie"
    min: 30
    max: 220
    step: 1
    unit_of_measurement: "bpm"
    icon: mdi:heart-pulse

  goedheid_ademfrequentie:
    name: "Ademfrequentie"
    min: 6
    max: 50
    step: 1
    unit_of_measurement: "/min"
    icon: mdi:lungs

  goedheid_saturatie:
    name: "Saturatie"
    min: 50
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:oxygen-cylinder

  goedheid_bloeddruk_sys:
    name: "Bloeddruk Systolisch"
    min: 0
    max: 250
    step: 1
    unit_of_measurement: "mmHg"
    icon: mdi:heart-pulse

  goedheid_bloeddruk_dia:
    name: "Bloeddruk Diastolisch"
    min: 0
    max: 150
    step: 1
    unit_of_measurement: "mmHg"
    icon: mdi:heart-pulse

  goedheid_hartfrequentie:
    name: "Hartfrequentie"
    min: 0
    max: 200
    step: 1
    unit_of_measurement: "bpm"
    icon: mdi:pulse

  goedheid_ademfrequentie:
    name: "Ademfrequentie"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "/min"
    icon: mdi:lungs

  goedheid_saturatie:
    name: "Saturatie"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:oxygen

  config_alert_low_saturation_threshold:
    name: "Low saturation alert threshold"
    min: 50
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:heart-pulse

input_text:
  goedheid_student_id:
    name: "Student ID"
    min: 1
    max: 50
    icon: mdi:account-badge

  goedheid_opmerking:
    name: "Opmerking"
    min: 1
    max: 255
    icon: mdi:note-text

input_boolean:
  goedheid_weegschaal_gereserveerd:
    name: "Weegschaal gereserveerd (Xerte)"
    icon: mdi:calendar-check

  goedheid_kennis_vochtbalans_bmi:
    name: "Studenten kennen vochtbalans & BMI"
    icon: mdi:water-percent

  goedheid_kennis_spijsvertering:
    name: "Studenten kennen spijsvertering"
    icon: mdi:stomach

template:
  - sensor:
      - name: "display_gewicht"
        unique_id: display_gewicht
        unit_of_measurement: "kg"
        device_class: weight
        state_class: measurement
        state: >
          {%- set bron = states("input_select.data_bron_weegschaal") | lower | replace(" ", "") -%}
          {%- if bron == "simulatie" %}
            {{ states("input_number.goedheid_gewicht") }}
          {%- else %}
            {%- set gewicht_primary = states("sensor.withings_gewicht") %}
            {{ gewicht_primary if gewicht_primary not in ["unknown","unavailable","none",""] else states("sensor.withings_weight") }}
          {%- endif %}
        icon: mdi:scale-bathroom

      - name: "display_bloeddruk_systolisch"
        unique_id: display_bloeddruk_systolisch
        unit_of_measurement: "mmHg"
        state_class: measurement
        state: >
          {%- if is_state("input_select.data_bron_weegschaal", "Simulatie") %}
            {{ states("input_number.goedheid_bloeddruk_sys") }}
          {%- else %}
            {{ states("sensor.withings_systolische_bloeddruk") }}
          {%- endif %}
        icon: mdi:blood-bag

      - name: "display_bloeddruk_diastolisch"
        unique_id: display_bloeddruk_diastolisch
        unit_of_measurement: "mmHg"
        state_class: measurement
        state: >
          {%- if is_state("input_select.data_bron_weegschaal", "Simulatie") %}
            {{ states("input_number.goedheid_bloeddruk_dia") }}
          {%- else %}
            {{ states("sensor.withings_diastolische_bloeddruk") }}
          {%- endif %}
        icon: mdi:blood-bag

      - name: "display_bloeddruk"
        unique_id: display_bloeddruk
        state: >
          {{ states('sensor.display_bloeddruk_systolisch') }}/{{ states('sensor.display_bloeddruk_diastolisch') }}
        icon: mdi:blood-bag

      - name: "display_hartfrequentie"
        unique_id: display_hartfrequentie
        unit_of_measurement: "bpm"
        state_class: measurement
        state: >
          {%- if is_state("input_select.data_bron_weegschaal", "Simulatie") %}
            {{ states("input_number.goedheid_hartfrequentie") }}
          {%- else %}
            {{ states("sensor.withings_hartslag") }}
          {%- endif %}
        icon: mdi:heart-pulse

      - name: "display_ademfrequentie"
        unique_id: display_ademfrequentie
        unit_of_measurement: "/min"
        state_class: measurement
        state: "{{ states('input_number.goedheid_ademfrequentie') }}"
        icon: mdi:lungs

      - name: "display_saturatie"
        unique_id: display_saturatie
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {%- if is_state("input_select.data_bron_weegschaal", "Simulatie") %}
            {{ states("input_number.goedheid_saturatie") }}
          {%- else %}
            {{ states("sensor.withings_spo2") }}
          {%- endif %}
        icon: mdi:oxygen-cylinder

      - name: "goedheid_les_klaar"
        unique_id: goedheid_les_klaar
        state: >
          {{ is_state('input_boolean.goedheid_weegschaal_gereserveerd', 'on')
             and is_state('input_boolean.goedheid_kennis_vochtbalans_bmi', 'on')
             and is_state('input_boolean.goedheid_kennis_spijsvertering', 'on') }}
        icon: >
          {% if is_state('sensor.goedheid_les_klaar', 'True') %}
            mdi:check-circle
          {% else %}
            mdi:alert-circle
          {% endif %}

  - sensor:
      - name: "display_bloeddruk"
        unique_id: display_bloeddruk
        unit_of_measurement: "mmHg"
        state: >
          {%- set bron = states("input_select.data_bron_weegschaal") | lower | replace(" ", "") -%}
          {%- if bron == "simulatie" %}
            {{ (states("input_number.goedheid_bloeddruk_sys") | int(0)) ~ "/" ~ (states("input_number.goedheid_bloeddruk_dia") | int(0)) }}
          {%- else %}
            {%- set sys_primary = states("sensor.withings_systolische_bloeddruk") %}
            {%- set sys = sys_primary if sys_primary not in ["unknown","unavailable","none",""] else states("sensor.withings_bloeddruk_sys") %}
            {%- set dia_primary = states("sensor.withings_diastolische_bloeddruk") %}
            {%- set dia = dia_primary if dia_primary not in ["unknown","unavailable","none",""] else states("sensor.withings_bloeddruk_dia") %}
            {{ (sys if sys not in ["unknown","unavailable","none",""] else "unknown") ~ "/" ~ (dia if dia not in ["unknown","unavailable","none",""] else "unknown") }}
          {%- endif %}
        icon: mdi:heart-pulse

      - name: "display_bloeddruk_systolisch"
        unique_id: display_bloeddruk_systolisch
        unit_of_measurement: "mmHg"
        state_class: measurement
        state: >
          {%- set bron = states("input_select.data_bron_weegschaal") | lower | replace(" ", "") -%}
          {%- if bron == "simulatie" %}
            {{ states("input_number.goedheid_bloeddruk_sys") }}
          {%- else %}
            {%- set sys_primary = states("sensor.withings_systolische_bloeddruk") %}
            {{ sys_primary if sys_primary not in ["unknown","unavailable","none",""] else states("sensor.withings_bloeddruk_sys") }}
          {%- endif %}
        icon: mdi:arrow-up-bold-hexagon-outline

      - name: "display_bloeddruk_diastolisch"
        unique_id: display_bloeddruk_diastolisch
        unit_of_measurement: "mmHg"
        state_class: measurement
        state: >
          {%- set bron = states("input_select.data_bron_weegschaal") | lower | replace(" ", "") -%}
          {%- if bron == "simulatie" %}
            {{ states("input_number.goedheid_bloeddruk_dia") }}
          {%- else %}
            {%- set dia_primary = states("sensor.withings_diastolische_bloeddruk") %}
            {{ dia_primary if dia_primary not in ["unknown","unavailable","none",""] else states("sensor.withings_bloeddruk_dia") }}
          {%- endif %}
        icon: mdi:arrow-down-bold-hexagon-outline

      - name: "display_hartfrequentie"
        unique_id: display_hartfrequentie
        unit_of_measurement: "bpm"
        state_class: measurement
        state: >
          {%- set bron = states("input_select.data_bron_weegschaal") | lower | replace(" ", "") -%}
          {%- if bron == "simulatie" %}
            {{ states("input_number.goedheid_hartfrequentie") }}
          {%- else %}
            {%- set hart_primary = states("sensor.withings_hartfrequentie") %}
            {{ hart_primary if hart_primary not in ["unknown","unavailable","none",""] else states("sensor.withings_hartslag") }}
          {%- endif %}
        icon: mdi:heart

      - name: "display_ademfrequentie"
        unique_id: display_ademfrequentie
        unit_of_measurement: "/min"
        state_class: measurement
        state: >
          {%- set bron = states("input_select.data_bron_weegschaal") | lower | replace(" ", "") -%}
          {%- if bron == "simulatie" %}
            {{ states("input_number.goedheid_ademfrequentie") }}
          {%- else %}
            {%- set adem_primary = states("sensor.withings_ademhalingsfrequentie") %}
            {{ adem_primary if adem_primary not in ["unknown","unavailable","none",""] else states("sensor.withings_ademfrequentie") }}
          {%- endif %}
        icon: mdi:lungs

      - name: "display_saturatie"
        unique_id: display_saturatie
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {%- if is_state("input_select.data_bron_weegschaal", "Simulatie") %}
            {{ states("input_number.goedheid_saturatie") }}
          {%- else %}
            {%- set live_primary = states("sensor.withings_zuurstofsaturatie") %}
            {%- set live = live_primary if live_primary not in ["unknown", "unavailable", "none", ""] else states("sensor.withings_saturatie") %}
            {{ live if live not in ["unknown", "unavailable", "none", ""] else states("input_number.goedheid_saturatie") }}
          {%- endif %}
        icon: mdi:oxygen

  - binary_sensor:
      - name: "config_alert_low_saturation"
        unique_id: config_alert_low_saturation
        device_class: safety
        state: >
          {{ (states('sensor.display_saturatie') | float(100)) < (states('input_number.config_alert_low_saturation_threshold') | float(90)) }}

script:
  reset_goedheid_simulatie:
    alias: "Reset Simulatie Mevrouw Goedheid"
    icon: mdi:restart
    sequence:
      - service: simulation_manager.reset_simulation
      - service: input_select.select_option
        target:
          entity_id: input_select.simulatiefase_goedheid
        data:
          option: "Reset / Startklaar"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.goedheid_meetdatum
        data:
          date: "2026-03-01"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_gewicht
        data:
          value: 68
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_bloeddruk_sys
        data:
          value: 130
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_bloeddruk_dia
        data:
          value: 80
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_hartfrequentie
        data:
          value: 72
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_ademfrequentie
        data:
          value: 16
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_saturatie
        data:
          value: 96
      - service: input_text.set_value
        target:
          entity_id: input_text.goedheid_opmerking
        data:
          value: ""

  sync_display_naar_simulatie_invoer:
    alias: "Sync Meetwaarden naar Simulatie Invoer"
    icon: mdi:sync-circle
    sequence:
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_gewicht
        data:
          value: "{{ states('sensor.display_gewicht') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_bloeddruk_sys
        data:
          value: "{{ states('sensor.display_bloeddruk_systolisch') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_bloeddruk_dia
        data:
          value: "{{ states('sensor.display_bloeddruk_diastolisch') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_hartfrequentie
        data:
          value: "{{ states('sensor.display_hartfrequentie') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_saturatie
        data:
          value: "{{ states('sensor.display_vochtbalans') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_bloeddruk_sys
        data:
          value: "{{ states('sensor.display_bloeddruk_systolisch') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_bloeddruk_dia
        data:
          value: "{{ states('sensor.display_bloeddruk_diastolisch') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_hartfrequentie
        data:
          value: "{{ states('sensor.display_hartfrequentie') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_ademfrequentie
        data:
          value: "{{ states('sensor.display_ademfrequentie') | float(0) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.goedheid_saturatie
        data:
          value: "{{ states('sensor.display_saturatie') | float(0) }}"

  goedheid_sla_meting_op:
    alias: "Sla Huidige Cardio Meting Op"
    icon: mdi:content-save-check
    sequence:
      - service: simulation_manager.save_measurement
        data:
          gewicht:        "{{ states('input_number.goedheid_gewicht')        | float(0) }}"
          spiermassa:     "{{ states('input_number.goedheid_spiermassa')     | float(0) }}"
          vetmassa:       "{{ states('input_number.goedheid_vetmassa')       | float(0) }}"
          vochtbalans:    "{{ states('input_number.goedheid_vochtbalans')    | float(0) }}"
          bmi:            "{{ states('input_number.goedheid_bmi')            | float(0) }}"
          bloeddruk_sys:  "{{ states('input_number.goedheid_bloeddruk_sys')  | float(0) }}"
          bloeddruk_dia:  "{{ states('input_number.goedheid_bloeddruk_dia')  | float(0) }}"
          hartfrequentie: "{{ states('input_number.goedheid_hartfrequentie') | float(0) }}"
          ademfrequentie: "{{ states('input_number.goedheid_ademfrequentie') | float(0) }}"
          saturatie:      "{{ states('input_number.goedheid_saturatie')      | float(0) }}"
          opmerking:      "{{ states('input_text.goedheid_opmerking')        | trim }}"
          timestamp:      "{{ states('input_datetime.goedheid_meetdatum')    }}"

  scan_photos_directory:
    alias: "Scan Photos Directory"
    icon: mdi:folder-refresh
    sequence:
      - service: photo_scanner.scan

automation:
  - id: goedheid_simulatie_fase_wissel
    alias: "Goedheid - Update cardio metingen bij fasewissel"
    trigger:
      - platform: state
        entity_id: input_select.simulatiefase_goedheid
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.simulatiefase_goedheid
                state: "Reset / Startklaar"
            sequence:
              - service: script.reset_goedheid_simulatie

          - conditions:
              - condition: state
                entity_id: input_select.simulatiefase_goedheid
                state: "Meting 1 (01-03)"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.goedheid_meetdatum
                data:
                  date: "2026-03-01"
              - service: simulation_manager.switch_period
                data:
                  period_id: "period_1"
                  label: "Meting 1 (01-03)"
                  date: "2026-03-01"
          - conditions:
              - condition: state
                entity_id: input_select.simulatiefase_goedheid
                state: "Meting 2 (04-03)"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.goedheid_meetdatum
                data:
                  date: "2026-03-04"
              - service: simulation_manager.switch_period
                data:
                  period_id: "period_2"
                  label: "Meting 2 (04-03)"
                  date: "2026-03-04"
          - conditions:
              - condition: state
                entity_id: input_select.simulatiefase_goedheid
                state: "Meting 3 (08-03)"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.goedheid_meetdatum
                data:
                  date: "2026-03-08"
              - service: simulation_manager.switch_period
                data:
                  period_id: "period_3"
                  label: "Meting 3 (08-03)"
                  date: "2026-03-08"
          - conditions:
              - condition: state
                entity_id: input_select.simulatiefase_goedheid
                state: "Meting 4 (11-03)"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.goedheid_meetdatum
                data:
                  date: "2026-03-11"
              - service: simulation_manager.switch_period
                data:
                  period_id: "period_4"
                  label: "Meting 4 (11-03)"
                  date: "2026-03-11"
          - conditions:
              - condition: state
                entity_id: input_select.simulatiefase_goedheid
                state: "Meting 5 (15-03)"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.goedheid_meetdatum
                data:
                  date: "2026-03-15"
              - service: simulation_manager.switch_period
                data:
                  period_id: "period_5"
                  label: "Meting 5 (15-03)"
                  date: "2026-03-15"
          - conditions:
              - condition: state
                entity_id: input_select.simulatiefase_goedheid
                state: "Meting 6 (18-03)"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.goedheid_meetdatum
                data:
                  date: "2026-03-18"
              - service: simulation_manager.switch_period
                data:
                  period_id: "period_6"
                  label: "Meting 6 (18-03)"
                  date: "2026-03-18"
          - conditions:
              - condition: state
                entity_id: input_select.simulatiefase_goedheid
                state: "Meting 7 (22-03)"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.goedheid_meetdatum
                data:
                  date: "2026-03-22"
              - service: simulation_manager.switch_period
                data:
                  period_id: "period_7"
                  label: "Meting 7 (22-03)"
                  date: "2026-03-22"
          - conditions:
              - condition: state
                entity_id: input_select.simulatiefase_goedheid
                state: "Meting 8 (25-03)"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.goedheid_meetdatum
                data:
                  date: "2026-03-25"
              - service: simulation_manager.switch_period
                data:
                  period_id: "period_8"
                  label: "Meting 8 (25-03)"
                  date: "2026-03-25"
        default:
          - service: system_log.write
            data:
              message: "Goedheid simulatie: onbekende fase geselecteerd"
              level: warning

  - id: goedheid_period_naar_fase_sync
    alias: "Goedheid - simulation_manager periode naar simulatiefase bridge"
    trigger:
      - platform: state
        entity_id: sensor.simulation_manager
    condition:
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.simulation_manager
            state: "none"
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: sensor.simulation_manager
                state: "period_1"
            sequence:
              - service: input_select.select_option
                target: { entity_id: input_select.simulatiefase_goedheid }
                data: { option: "Meting 1 (01-03-2026)" }
          - conditions:
              - condition: state
                entity_id: sensor.simulation_manager
                state: "period_2"
            sequence:
              - service: input_select.select_option
                target: { entity_id: input_select.simulatiefase_goedheid }
                data: { option: "Meting 2 (04-03-2026)" }
          - conditions:
              - condition: state
                entity_id: sensor.simulation_manager
                state: "period_3"
            sequence:
              - service: input_select.select_option
                target: { entity_id: input_select.simulatiefase_goedheid }
                data: { option: "Meting 3 (08-03-2026)" }
          - conditions:
              - condition: state
                entity_id: sensor.simulation_manager
                state: "period_4"
            sequence:
              - service: input_select.select_option
                target: { entity_id: input_select.simulatiefase_goedheid }
                data: { option: "Meting 4 (11-03-2026)" }
          - conditions:
              - condition: state
                entity_id: sensor.simulation_manager
                state: "period_5"
            sequence:
              - service: input_select.select_option
