type: horizontal-stack
cards:
  - type: entities
    title: Huidige Meetwaarden
    entities:
      - entity: sensor.gewicht
        name: Gewicht
      - entity: sensor.bloeddruk
        name: Bloeddruk
      - entity: sensor.hartfrequentie
        name: Hartfrequentie
      - entity: sensor.ademfrequentie
        name: Ademfrequentie
      - entity: sensor.saturatie
        name: Saturatie
      - entity: binary_sensor.goedheid_alert_lage_saturatie
        name: Alert lage saturatie (<93)
      - entity: binary_sensor.goedheid_alert_hoge_pols
        name: Alert hoge pols (>100)

  - type: entities
    title: Simulatie Invoer
    entities:
      - entity: input_number.goedheid_gewicht
        name: Gewicht (kg)
      - entity: input_number.goedheid_bloeddruk_sys
        name: Bloeddruk systolisch (mmHg)
      - entity: input_number.goedheid_bloeddruk_dia
        name: Bloeddruk diastolisch (mmHg)
      - entity: input_number.goedheid_hartfrequentie
        name: Hartfrequentie (bpm)
      - entity: input_number.goedheid_ademfrequentie
        name: Ademfrequentie (/min)
      - entity: input_number.goedheid_saturatie
        name: Saturatie (%)
      - entity: input_text.goedheid_opmerking
        name: Opmerking
      - type: divider
      - entity: script.sync_display_naar_simulatie_invoer
        name: Sync live waarden naar simulatie
      - entity: script.goedheid_sla_meting_op
        name: Sla huidige meting op
