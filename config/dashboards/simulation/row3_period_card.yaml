      - entity: sensor.hartfrequentie
        name: Hartfrequentie
        unit: bpm
        data_generator: |
          return [
            [new Date('2026-03-01T09:00:00').getTime(), 72],
            [new Date('2026-03-04T09:00:00').getTime(), 74],
            [new Date('2026-03-08T09:00:00').getTime(), 78],
            [new Date('2026-03-11T09:00:00').getTime(), 80],
            [new Date('2026-03-15T09:00:00').getTime(), 86],
            [new Date('2026-03-18T09:00:00').getTime(), 90],
            [new Date('2026-03-22T09:00:00').getTime(), 96],
