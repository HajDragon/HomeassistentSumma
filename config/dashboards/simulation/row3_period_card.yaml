  - type: markdown
    title: Observatielog Progressie
    content: |
      | Datum | Opmerkingen |
      |---|---|
      | 01-03-2026 | **Stabiele situatie na ontslag** |
      | 04-03-2026 | Geen klachten |
      | 08-03-2026 | Licht vermoeid |
      | 11-03-2026 | Enkels licht gezwollen |
      | 15-03-2026 | Kortademig bij inspanning |
      | 18-03-2026 | **Meer oedeem in onderbenen** |
      | 22-03-2026 | **Gewicht stijgt snel** |
      | 25-03-2026 | Duidelijke verslechtering |
