      - entity: sensor.ademfrequentie
        name: Ademfrequentie
        unit: /min
        data_generator: |
          return [
            [new Date('2026-03-01T09:00:00').getTime(), 16],
            [new Date('2026-03-04T09:00:00').getTime(), 16],
            [new Date('2026-03-08T09:00:00').getTime(), 17],
            [new Date('2026-03-11T09:00:00').getTime(), 18],
            [new Date('2026-03-15T09:00:00').getTime(), 19],
            [new Date('2026-03-18T09:00:00').getTime(), 20],
            [new Date('2026-03-22T09:00:00').getTime(), 21],
            [new Date('2026-03-25T09:00:00').getTime(), 22],
