type: vertical-stack
cards:
  - type: custom:simulation-period-card
    title: Body Scan en BPM Connect - Meetreeks
    show_chart: false
    columns:
      - timestamp
      - gewicht
      - bloeddruk
      - hartfrequentie
      - ademfrequentie
      - saturatie
      - opmerking
    column_labels:
      timestamp: Datum
      gewicht: Gewicht (kg)
      bloeddruk: Bloeddruk (mmHg)
      hartfrequentie: Pols (bpm)
      ademfrequentie: Ademfreq. (/min)
      saturatie: Saturatie (%)
      opmerking: Opmerkingen
    live_input_entities:
      gewicht: input_number.goedheid_gewicht
      bloeddruk_sys: input_number.goedheid_bloeddruk_sys
      bloeddruk_dia: input_number.goedheid_bloeddruk_dia
      hartfrequentie: input_number.goedheid_hartfrequentie
      ademfrequentie: input_number.goedheid_ademfrequentie
      saturatie: input_number.goedheid_saturatie

  - type: custom:apexcharts-card
    header:
      title: Cardiale Trend op basis van maartmetingen
      show: true
    graph_span: 25d
    span:
      start: day
    series:
      - entity: sensor.gewicht
        name: Gewicht
        unit: kg
        data_generator: |
          return [
            [new Date('2026-03-01T09:00:00').getTime(), 68.0],
            [new Date('2026-03-04T09:00:00').getTime(), 68.2],
            [new Date('2026-03-08T09:00:00').getTime(), 68.7],
            [new Date('2026-03-11T09:00:00').getTime(), 69.3],
            [new Date('2026-03-15T09:00:00').getTime(), 70.1],
            [new Date('2026-03-18T09:00:00').getTime(), 70.8],
            [new Date('2026-03-22T09:00:00').getTime(), 71.5],
            [new Date('2026-03-25T09:00:00').getTime(), 72.2],
          ];
      - entity: sensor.display_bloeddruk_systolisch
        name: Bloeddruk systolisch
        unit: mmHg
        data_generator: |
          return [
            [new Date('2026-03-01T09:00:00').getTime(), 130],
            [new Date('2026-03-04T09:00:00').getTime(), 132],
            [new Date('2026-03-08T09:00:00').getTime(), 135],
            [new Date('2026-03-11T09:00:00').getTime(), 138],
            [new Date('2026-03-15T09:00:00').getTime(), 142],
            [new Date('2026-03-18T09:00:00').getTime(), 145],
            [new Date('2026-03-22T09:00:00').getTime(), 150],
            [new Date('2026-03-25T09:00:00').getTime(), 155],
