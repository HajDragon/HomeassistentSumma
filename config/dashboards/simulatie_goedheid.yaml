title: Simulatie Goedheid
views:
  - title: Simulatie Mevrouw Goedheid
    path: simulatie-goedheid
    icon: mdi:scale-bathroom
    type: masonry
    cards:
      - &ref_0
        type: vertical-stack
        cards:
          - type: entities
            title: Databron en Simulatiefase
            entities:
              - entity: input_select.data_bron_weegschaal
                name: Databron
              - entity: input_select.simulatiefase_goedheid
                name: Simulatiefase
              - entity: input_datetime.goedheid_meetdatum
                name: Datum van meting
          - type: markdown
            title: Patiëntprofiel
            content: |
              **Mevrouw Goedheid**
              - Leeftijd: **70 jaar**
              - Anamnese: **Myocardinfarct (MI), artrose**
              - Monitoring focus: **Body Scan en BPM Connect**
              - Huidig gewicht (laatste meetpunt): **72.2 kg op 25-03-2026**
      - type: horizontal-stack
        cards: &ref_1
          - type: entities
            title: Huidige Meetwaarden
            entities:
              - entity: sensor.gewicht
                name: Gewicht
              - entity: sensor.bloeddruk
                name: Bloeddruk
              - entity: sensor.hartfrequentie
                name: Hartfrequentie
              - entity: sensor.ademfrequentie
                name: Ademfrequentie
              - entity: sensor.saturatie
                name: Saturatie
              - entity: binary_sensor.goedheid_alert_lage_saturatie
                name: Alert lage saturatie (<93)
              - entity: binary_sensor.goedheid_alert_hoge_pols
                name: Alert hoge pols (>100)
          - type: entities
            title: Simulatie Invoer
            entities:
              - entity: input_number.goedheid_gewicht
                name: Gewicht (kg)
              - entity: input_number.goedheid_bloeddruk_sys
                name: Bloeddruk systolisch (mmHg)
              - entity: input_number.goedheid_bloeddruk_dia
                name: Bloeddruk diastolisch (mmHg)
              - entity: input_number.goedheid_hartfrequentie
                name: Hartfrequentie (bpm)
              - entity: input_number.goedheid_ademfrequentie
                name: Ademfrequentie (/min)
              - entity: input_number.goedheid_saturatie
                name: Saturatie (%)
              - entity: input_text.goedheid_opmerking
                name: Opmerking
              - type: divider
              - entity: script.sync_display_naar_simulatie_invoer
                name: Sync live waarden naar simulatie
              - entity: script.goedheid_sla_meting_op
                name: Sla huidige meting op
      - type: vertical-stack
        cards:
          - type: custom:simulation-period-card
            title: Body Scan en BPM Connect - Meetreeks
            show_chart: false
            columns:
              - timestamp
              - gewicht
              - bloeddruk
              - hartfrequentie
              - ademfrequentie
              - saturatie
              - opmerking
            column_labels:
              timestamp: Datum
              gewicht: Gewicht (kg)
              bloeddruk: Bloeddruk (mmHg)
              hartfrequentie: Pols (bpm)
              ademfrequentie: Ademfreq. (/min)
              saturatie: Saturatie (%)
              opmerking: Opmerkingen
            live_input_entities:
              gewicht: input_number.goedheid_gewicht
              bloeddruk_sys: input_number.goedheid_bloeddruk_sys
              bloeddruk_dia: input_number.goedheid_bloeddruk_dia
              hartfrequentie: input_number.goedheid_hartfrequentie
              ademfrequentie: input_number.goedheid_ademfrequentie
              saturatie: input_number.goedheid_saturatie
          - type: custom:apexcharts-card
            header:
              title: Cardiale Trend op basis van maartmetingen
              show: true
            graph_span: 25d
            span:
              start: day
            series:
              - entity: sensor.gewicht
                name: Gewicht
                unit: kg
                data_generator: |
                  return [
                    [new Date('2026-03-01T09:00:00').getTime(), 68.0],
                    [new Date('2026-03-04T09:00:00').getTime(), 68.2],
                    [new Date('2026-03-08T09:00:00').getTime(), 68.7],
                    [new Date('2026-03-11T09:00:00').getTime(), 69.3],
                    [new Date('2026-03-15T09:00:00').getTime(), 70.1],
                    [new Date('2026-03-18T09:00:00').getTime(), 70.8],
                    [new Date('2026-03-22T09:00:00').getTime(), 71.5],
                    [new Date('2026-03-25T09:00:00').getTime(), 72.2],
                  ];
              - entity: sensor.display_bloeddruk_systolisch
                name: Bloeddruk systolisch
                unit: mmHg
                data_generator: |
                  return [
                    [new Date('2026-03-01T09:00:00').getTime(), 130],
                    [new Date('2026-03-04T09:00:00').getTime(), 132],
                    [new Date('2026-03-08T09:00:00').getTime(), 135],
                    [new Date('2026-03-11T09:00:00').getTime(), 138],
                    [new Date('2026-03-15T09:00:00').getTime(), 142],
                    [new Date('2026-03-18T09:00:00').getTime(), 145],
                    [new Date('2026-03-22T09:00:00').getTime(), 150],
                    [new Date('2026-03-25T09:00:00').getTime(), 155],
                  ];
              - entity: sensor.hartfrequentie
                name: Hartfrequentie
                unit: bpm
                data_generator: |
                  return [
                    [new Date('2026-03-01T09:00:00').getTime(), 72],
                    [new Date('2026-03-04T09:00:00').getTime(), 74],
                    [new Date('2026-03-08T09:00:00').getTime(), 78],
                    [new Date('2026-03-11T09:00:00').getTime(), 80],
                    [new Date('2026-03-15T09:00:00').getTime(), 86],
                    [new Date('2026-03-18T09:00:00').getTime(), 90],
                    [new Date('2026-03-22T09:00:00').getTime(), 96],
                    [new Date('2026-03-25T09:00:00').getTime(), 102],
                  ];
              - entity: sensor.ademfrequentie
                name: Ademfrequentie
                unit: /min
                data_generator: |
                  return [
                    [new Date('2026-03-01T09:00:00').getTime(), 16],
                    [new Date('2026-03-04T09:00:00').getTime(), 16],
                    [new Date('2026-03-08T09:00:00').getTime(), 17],
                    [new Date('2026-03-11T09:00:00').getTime(), 18],
                    [new Date('2026-03-15T09:00:00').getTime(), 19],
                    [new Date('2026-03-18T09:00:00').getTime(), 20],
                    [new Date('2026-03-22T09:00:00').getTime(), 21],
                    [new Date('2026-03-25T09:00:00').getTime(), 22],
                  ];
              - entity: sensor.saturatie
                name: Saturatie
                unit: '%'
                data_generator: |
                  return [
                    [new Date('2026-03-01T09:00:00').getTime(), 96],
                    [new Date('2026-03-04T09:00:00').getTime(), 96],
                    [new Date('2026-03-08T09:00:00').getTime(), 95],
                    [new Date('2026-03-11T09:00:00').getTime(), 95],
                    [new Date('2026-03-15T09:00:00').getTime(), 94],
                    [new Date('2026-03-18T09:00:00').getTime(), 94],
                    [new Date('2026-03-22T09:00:00').getTime(), 93],
                    [new Date('2026-03-25T09:00:00').getTime(), 92],
                  ];
          - type: markdown
            title: Observatielog Progressie
            content: |
              | Datum | Opmerkingen |
              |---|---|
              | 01-03-2026 | **Stabiele situatie na ontslag** |
              | 04-03-2026 | Geen klachten |
              | 08-03-2026 | Licht vermoeid |
              | 11-03-2026 | Enkels licht gezwollen |
              | 15-03-2026 | Kortademig bij inspanning |
              | 18-03-2026 | **Meer oedeem in onderbenen** |
              | 22-03-2026 | **Gewicht stijgt snel** |
              | 25-03-2026 | Duidelijke verslechtering |
  - title: Simulatie Mevrouw Goedheid
    icon: mdi:scale-bathroom
    type: sections
    cards: []
    sections:
      - type: grid
        cards:
          - *ref_0
          - type: vertical-stack
            cards:
              - type: markdown
                title: Observatielog Progressie
                content: |
                  <div style="text-align: center">

                  | Datum | Opmerkingen |
                  |---|---|
                  | 01-03-2026 | **Stabiele situatie na ontslag** |
                  | 04-03-2026 | Geen klachten |
                  | 08-03-2026 | Licht vermoeid |
                  | 11-03-2026 | Enkels licht gezwollen |
                  | 15-03-2026 | Kortademig bij inspanning |
                  | 18-03-2026 | **Meer oedeem in onderbenen** |
                  | 22-03-2026 | **Gewicht stijgt snel** |
                  | 25-03-2026 | Duidelijke verslechtering |
      - type: grid
        cards:
          - type: horizontal-stack
            cards: *ref_1
            grid_options:
              columns: full
              rows: auto
          - type: markdown
            title: Cardiale Meetreeks — Maart 2026
            card_mod: *ref_2
            content: >
              | Datum | Gewicht | Bloeddruk | Hartfrequentie | Ademfrequentie |
              Saturatie | Opmerkingen |

              |---|---:|---|---:|---:|---:|---|

              | 01-03-2026 | 68.0 kg | 130/80 mmHg | 72 bpm | 16/min | 96% |
              Stabiele situatie na ontslag |

              | 04-03-2026 | 68.2 kg | 132/82 mmHg | 74 bpm | 16/min | 96% | Geen
              klachten |

              | 08-03-2026 | 68.7 kg | 135/85 mmHg | 78 bpm | 17/min | 95% | Licht
              vermoeid |

              | 11-03-2026 | 69.3 kg | 138/86 mmHg | 80 bpm | 18/min | 95% |
              Enkels licht gezwollen |

              | 15-03-2026 | 70.1 kg | 142/88 mmHg | 86 bpm | 19/min | 94% |
              Kortademig bij inspanning |

              | 18-03-2026 | 70.8 kg | 145/90 mmHg | 90 bpm | 20/min | 94% | Meer
              oedeem in onderbenen |

              | 22-03-2026 | 71.5 kg | 150/92 mmHg | 96 bpm | 21/min | 93% |
              Gewicht stijgt snel |

              | 25-03-2026 | 72.2 kg | 155/95 mmHg | 102 bpm | 22/min | 92% |
              Duidelijke verslechtering |


