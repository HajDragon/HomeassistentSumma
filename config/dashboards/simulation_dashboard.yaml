views:
  - title: Simulatie Dashboard
    path: simulatie-dashboard
    icon: mdi:stethoscope
    type: masonry
    cards:
      - type: entities
        title: Active Assignment Control
        show_header_toggle: false
        entities:
          - entity: input_select.active_simulation_patient
            name: Active Patient
          - entity: input_select.active_simulation_phase
            name: Active Phase
          - entity: input_datetime.active_simulation_measurement_date
            name: Measurement Date

      - type: horizontal-stack
        cards:
          - type: button
            name: Apply Profile
            icon: mdi:account-sync
            tap_action:
              action: call-service
              service: script.active_patient_apply_profile
          - type: button
            name: Save Measurement
            icon: mdi:content-save
            tap_action:
              action: call-service
              service: script.active_patient_save_measurement
          - type: button
            name: Reset Timeline
            icon: mdi:restart
            tap_action:
              action: call-service
              service: script.active_patient_reset_timeline

      - type: markdown
        title: Active Patient Summary
        content: |
          ## {{ states('sensor.active_patient_name') }}
          - Leeftijd: {{ states('sensor.active_patient_age') }} jaar
          - Geslacht: {{ states('sensor.active_patient_gender') }}
          - Focus: {{ states('sensor.active_patient_case_focus') }}
          - Achtergrond: {{ states('sensor.active_patient_primary_condition') }}

      - type: conditional
        conditions:
          - entity: input_boolean.active_patient_supports_cardiac
            state: "on"
        card:
          type: entities
          title: Cardiac Monitoring
          entities:
            - entity: sensor.active_patient_bp
              name: Blood Pressure
            - entity: sensor.active_patient_heart_rate
              name: Heart Rate

      - type: conditional
        conditions:
          - entity: input_boolean.active_patient_supports_skin_triage
            state: "on"
        card:
          type: entities
          title: Skin Video Triage
          entities:
            - entity: sensor.active_patient_skin_triage
              name: Triage Notes

      - type: conditional
        conditions:
          - entity: input_boolean.active_patient_supports_temperature
            state: "on"
        card:
          type: entities
          title: Temperature Follow-up
          entities:
            - entity: sensor.active_patient_temperature
              name: Temperature

      - type: custom:simulation-period-card
        title: Simulation Timeline
        show_chart: true
        columns:
          - timestamp
          - heart_rate
          - blood_pressure
          - temperature
          - skin_triage
        column_labels:
          timestamp: Meetmoment
          heart_rate: Hartslag (bpm)
          blood_pressure: Bloeddruk
          temperature: Temperatuur (°C)
          skin_triage: Huid triage

      - type: markdown
        title: Dashboard Principle
        content: |
          Deze view gebruikt uitsluitend generic Active Patient entities.
          Voor Casus 3 hoef je alleen de backend-profieldata uit te breiden,
          niet de dashboard YAML.
