switch_period:
  name: Switch Period
  description: >
    Switch the active simulation period. If the period does not exist yet,
    it is created automatically. Data from every previous period is preserved
    in memory and in persistent storage.
  fields:
    period_id:
      name: Period ID
      description: >
        Unique machine-readable identifier for this period.
        Use lowercase with underscores, e.g. "period_1" or "goedheid_meting_1".
      required: true
      example: "period_1"
      selector:
        text:
    label:
      name: Label
      description: Human-readable display name shown in the dashboard tab.
      required: false
      example: "Meting 1 (start)"
      selector:
        text:
    date:
      name: Date
      description: ISO 8601 date for this period (YYYY-MM-DD).
      required: false
      example: "2026-01-01"
      selector:
        date:

save_measurement:
  name: Save Measurement
  description: >
    Appends one measurement record to the currently active period.
    You must call switch_period before calling this service.
    All fields are optional — omit any metric your scale does not measure.
  fields:
    gewicht:
      name: Gewicht (kg)
      description: Total body weight in kilograms.
      required: false
      example: 70.0
      selector:
        number:
          min: 0
          max: 300
          step: 0.1
          unit_of_measurement: "kg"
    spiermassa:
      name: Spiermassa (kg)
      description: Skeletal muscle mass in kilograms.
      required: false
      example: 29.5
      selector:
        number:
          min: 0
          max: 150
          step: 0.1
          unit_of_measurement: "kg"
    vetmassa:
      name: Vetmassa (kg)
      description: Body fat mass in kilograms.
      required: false
      example: 24.0
      selector:
        number:
          min: 0
          max: 150
          step: 0.1
          unit_of_measurement: "kg"
    bmi:
      name: BMI (kg/m²)
      description: Body Mass Index, calculated or measured.
      required: false
      example: 24.8
      selector:
        number:
          min: 0
          max: 60
          step: 0.1
          unit_of_measurement: "kg/m²"
    timestamp:
      name: Timestamp
      description: >
        ISO 8601 datetime string. Defaults to the current UTC time when omitted.
      required: false
      example: "2026-01-01T09:00:00+00:00"
      selector:
        text:

reset_simulation:
  name: Reset Simulation
  description: >
    Permanently wipe all period and measurement data and reset the active-period
    pointer to none. This action cannot be undone — use with care.
