                            }
                            ha-state-icon:hover::before { opacity: 1; }
                            ha-state-icon:hover::after { opacity: 1; }
                  - type: button
                    name: "Sla Meting Op"
                    icon: mdi:content-save-check
                    icon_height: 36px
                    tap_action:
                      action: call-service
                      service: script.goedheid_sla_meting_op
                    card_mod:
                      style: |
                        :host {
                          --primary-color: #43a047;
                          position: relative; z-index: 1;
                        }
                        :host(:hover) { z-index: 100; }
                        ha-card { position: relative; overflow: visible !important; }
                        ha-state-icon {
                          position: static !important;
                          pointer-events: none;
                        }
