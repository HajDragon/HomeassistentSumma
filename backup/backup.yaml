                        }
                        ha-state-icon:hover::before { opacity: 1; }
                        ha-state-icon:hover::after { opacity: 1; }

          # Stappenplan — spans full width
          - type: markdown
            title: "Stappenplan voor de Les"
            card_mod:
              style: |
                ha-card { width: 100%; box-sizing: border-box; margin-top: 16px; }
            content: |
              **Stap 1 — Controleer de databron**
              Zorg dat bovenaan **Simulatie** is geselecteerd, niet "Live Data".

              **Stap 2 — Navigeer naar Meting 1**
              Druk op de knop **Meting 1** (rechts). De actieve periode wisselt naar januari 2026.

              **Stap 3 — Voer de waarden in en sla op**
              Stel de sliders in op de gewenste meetwaarden. Druk daarna op de groene knop **Sla Meting Op** om de waarden op te slaan in deze periode.

              **Stap 4 — Bespreek met de klas**
              Bekijk de opgeslagen waarden in de tabel. Vraag de studenten: *"Wat valt op?"*

              **Stap 5 — Ga door naar Meting 2, 3 en 4**
              Druk op de volgende meetknop, pas de sliders aan, en sla weer op met **Sla Meting Op**. Vergelijk de veranderingen.

              **Stap 6 — Afsluiten**
              Druk op de rode knop **Reset Simulatie** en bevestig. Het systeem is klaar voor de volgende les.

              ---
              💡 *Oranje knipperende rij in de tabel = nog niet opgeslagen. Druk op **Sla Meting Op** om te bevestigen.*

      # ══ ROW 2 — Huidige Meetwaarden ══════════════════════════════════
