                  }
                  .card-header::before {
                    content: "Pas de waarden aan met de sliders. Wijzigingen worden automatisch opgeslagen. Gebruik Sync om live-data als startpunt over te nemen.";
                    position: absolute; top: 80%; right: 12px;
                    background: rgba(20,20,20,0.95); color: #fff;
                    padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: normal; line-height: 1.6;
