          - gewicht
          - spiermassa
          - vetmassa
          - bmi
        column_labels:
          timestamp:  "Datum"
          gewicht:    "Gewicht (kg)"
          spiermassa: "Spiermassa (kg)"
          vetmassa:   "Vetmassa (kg)"
          bmi:        "BMI (kg/m²)"
        live_input_entities:
          gewicht:    input_number.goedheid_gewicht
          spiermassa: input_number.goedheid_spiermassa
          vetmassa:   input_number.goedheid_vetmassa
          bmi:        input_number.goedheid_bmi

