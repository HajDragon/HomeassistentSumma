                            }
                            ha-state-icon:hover::before { opacity: 1; }
                            ha-state-icon:hover::after { opacity: 1; }
                      - type: button
                        name: "Meting 3"
                        icon: mdi:numeric-3-circle
                        tap_action:
                          action: call-service
                          service: input_select.select_option
                          service_data:
                            entity_id: input_select.simulatiefase_goedheid
                            option: "Meting 3 (4 mnd)"
                        card_mod:
                          style: |
                            :host { position: relative; z-index: 1; }
                            :host(:hover) { z-index: 100; }
                            ha-card { position: relative; overflow: visible !important; }
                            ha-state-icon {
                              position: static !important;
                              pointer-events: none;
                            }
                            ha-state-icon::before {
                              content: "?";
                              pointer-events: auto;
                              position: absolute; top: 6px; right: 6px;
                              width: 18px; height: 18px;
                              background: var(--primary-color, #03a9f4); color: white; border-radius: 50%;
                              font-size: 10px; font-weight: bold; font-family: sans-serif;
