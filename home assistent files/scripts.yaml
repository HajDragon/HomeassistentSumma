submit_waarde:
  alias: "Submit Waarde naar Huidige Periode"
  description: >
    Reads the current values of the Simulatie Invoer sliders and the active
    measurement date from input_datetime.goedheid_meetdatum, then saves them
    as a new measurement in the currently active simulation period.
    Switch the active period first via the Meting 1–4 buttons or the
    simulation-period-card before calling this script.
  sequence:
    # Step 1 — update the active period's date to match the meetdatum helper
    # switch_period on an existing period only overwrites label/date — measurements are preserved
    - service: simulation_manager.switch_period
      data:
        period_id: "{{ states('sensor.simulation_manager') }}"
        date: "{{ states('input_datetime.goedheid_meetdatum') }}"
    # Step 2 — persist the current slider values with the same date as timestamp
    - service: simulation_manager.save_measurement
      data:
        gewicht:    "{{ states('input_number.goedheid_gewicht')    | float(0) }}"
        spiermassa: "{{ states('input_number.goedheid_spiermassa') | float(0) }}"
        vetmassa:   "{{ states('input_number.goedheid_vetmassa')   | float(0) }}"
        vochtbalans: "{{ states('input_number.goedheid_vochtbalans') | float(0) }}"
        bmi:        "{{ states('input_number.goedheid_bmi')        | float(0) }}"
        timestamp:  "{{ states('input_datetime.goedheid_meetdatum') }}"
        pesdie_student_id: "{{ states('input_text.goedheid_student_id') | trim }}"
        pesdie_output: "{{ states('input_text.goedheid_pesdie_output') | trim }}"
        pesdie_phase: "{{ states('input_select.simulatiefase_goedheid') }}"
        pesdie_saved_at: "{{ now().isoformat() }}"
  mode: single
  icon: mdi:content-save-check

submit_pesdie:
  alias: "Submit PESDIE naar Huidige Periode"
  description: >
    Saves one PESDIE submission for the active period and stores
    the PESDIE Output value as the submitted PESDIE number.
  sequence:
    - variables:
        pesdie_output_value: >
          {% set raw = states('input_text.goedheid_pesdie_output') | trim %}
          {{ '' if raw in ['unknown', 'unavailable', 'none'] else raw }}
    - service: simulation_manager.switch_period
      data:
        period_id: "{{ states('sensor.simulation_manager') }}"
        date: "{{ states('input_datetime.goedheid_meetdatum') }}"
    - service: simulation_manager.save_measurement
      data:
        timestamp: "{{ states('input_datetime.goedheid_meetdatum') }}"
        pesdie_submission_number: "{{ pesdie_output_value }}"
        pesdie_student_id: "{{ states('input_text.goedheid_student_id') | trim }}"
        pesdie_output: "{{ pesdie_output_value }}"
        pesdie_phase: "{{ states('input_select.simulatiefase_goedheid') }}"
        pesdie_saved_at: "{{ now().isoformat() }}"
  mode: single
  icon: mdi:clipboard-check-outline

reset_goedheid_simulatie_handmatig:
  alias: "Reset Simulatie Mevrouw Goedheid (Handmatig)"
  description: >
    Wipes the Simulation Manager state and resets all Goedheid helpers
    to a clean start so the next class can begin from scratch.
  sequence:
    - service: simulation_manager.reset_simulation
    - service: input_select.select_option
      target:
        entity_id: input_select.simulatiefase_goedheid
      data:
        option: "Reset / Startklaar"
    - service: input_number.set_value
      target:
        entity_id: input_number.goedheid_spiermassa
      data:
        value: 0
    - service: input_number.set_value
      target:
        entity_id: input_number.goedheid_vetmassa
      data:
        value: 0
    - service: input_number.set_value
      target:
        entity_id: input_number.goedheid_gewicht
      data:
        value: 0
    - service: input_number.set_value
      target:
        entity_id: input_number.goedheid_vochtbalans
      data:
        value: 0
    - service: input_number.set_value
      target:
        entity_id: input_number.goedheid_bmi
      data:
        value: 0
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.goedheid_meetdatum
      data:
        date: "{{ now().strftime('%Y-%m-%d') }}"
    - service: input_text.set_value
      target:
        entity_id: input_text.goedheid_student_id
      data:
        value: ""
    - service: input_text.set_value
      target:
        entity_id: input_text.goedheid_pesdie_output
      data:
        value: ""
  mode: single
  icon: mdi:restart

sync_display_naar_simulatie_invoer_handmatig:
  alias: "Sync Meetwaarden naar Simulatie Invoer (Handmatig)"
  description: >
    Copies currently displayed values (simulation or live source)
    into the editable Goedheid input helpers.
  sequence:
    - service: input_number.set_value
      target:
        entity_id: input_number.goedheid_gewicht
      data:
        value: "{{ states('sensor.display_gewicht') | float(0) }}"
    - service: input_number.set_value
      target:
        entity_id: input_number.goedheid_spiermassa
      data:
        value: "{{ states('sensor.display_spiermassa') | float(0) }}"
    - service: input_number.set_value
      target:
        entity_id: input_number.goedheid_vetmassa
      data:
        value: "{{ states('sensor.display_vetmassa') | float(0) }}"
    - service: input_number.set_value
      target:
        entity_id: input_number.goedheid_vochtbalans
      data:
        value: "{{ states('sensor.display_vochtbalans') | float(0) }}"
    - service: input_number.set_value
      target:
        entity_id: input_number.goedheid_bmi
      data:
        value: "{{ states('sensor.display_bmi') | float(0) }}"
  mode: single
  icon: mdi:sync-circle

goedheid_sla_meting_op_handmatig:
  alias: "Sla Huidige Meting Op (Handmatig)"
  description: >
    Saves current Goedheid helper values as one measurement in
    the active Simulation Manager period.
  sequence:
    - service: simulation_manager.save_measurement
      data:
        gewicht: "{{ states('input_number.goedheid_gewicht') | float(0) }}"
        spiermassa: "{{ states('input_number.goedheid_spiermassa') | float(0) }}"
        vetmassa: "{{ states('input_number.goedheid_vetmassa') | float(0) }}"
        vochtbalans: "{{ states('input_number.goedheid_vochtbalans') | float(0) }}"
        bmi: "{{ states('input_number.goedheid_bmi') | float(0) }}"
        timestamp: "{{ states('input_datetime.goedheid_meetdatum') }}"
        pesdie_student_id: "{{ states('input_text.goedheid_student_id') | trim }}"
        pesdie_output: "{{ states('input_text.goedheid_pesdie_output') | trim }}"
        pesdie_phase: "{{ states('input_select.simulatiefase_goedheid') }}"
        pesdie_saved_at: "{{ now().isoformat() }}"
  mode: single
  icon: mdi:content-save-check
